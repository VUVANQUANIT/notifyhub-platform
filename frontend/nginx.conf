pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Log only path/status: never query strings, headers, request bodies or invitation fragments.
  log_format safe '$remote_addr $request_method $uri $status';
  access_log /dev/stdout safe;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8443 ssl;
    ssl_certificate /run/tls/tls.crt;
    ssl_certificate_key /run/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 3m;
    include /etc/nginx/security-headers.conf;
    location = /healthz { access_log off; return 200 'ok'; }
    location /api/ {
      proxy_pass http://api-gateway:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header Forwarded '';
      proxy_hide_header Cache-Control;
      add_header Cache-Control 'no-store' always;
      include /etc/nginx/security-headers.conf;
    }
    location = /.well-known/jwks.json { proxy_pass http://api-gateway:8080; }
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
      try_files $uri =404;
      add_header Cache-Control 'public, max-age=31536000, immutable';
      include /etc/nginx/security-headers.conf;
    }
    location / {
      try_files $uri $uri/ /index.html;
      sub_filter_once off;
      sub_filter '__CSP_NONCE__' '$request_id';
      sub_filter '<style' '<style nonce="$request_id"';
      add_header Cache-Control 'no-store' always;
      include /etc/nginx/security-headers.conf;
    }
  }
}
