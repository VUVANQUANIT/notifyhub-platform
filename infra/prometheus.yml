global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: notifyhub-services
    metrics_path: /actuator/prometheus
    basic_auth:
      username: notifyhub-monitoring
      password_file: /run/secrets/monitoring_password
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels: {service: api-gateway}
      - targets: ['host.docker.internal:8081']
        labels: {service: auth-service}
      - targets: ['host.docker.internal:8082']
        labels: {service: campaign-service}
      - targets: ['host.docker.internal:8083']
        labels: {service: notification-service}
      - targets: ['host.docker.internal:8084']
        labels: {service: reporting-service}

  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ['rabbitmq:15692']
        labels: {service: rabbitmq}

  # Empty by default; setup-monitoring.ps1 -Kafka enables this target when the kafka profile runs.
  - job_name: kafka
    file_sd_configs:
      - files: ['/etc/prometheus/kafka-targets.json']
        refresh_interval: 15s

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
