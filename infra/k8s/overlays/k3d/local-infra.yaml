apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "postgres-data"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "2Gi"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "postgres"
spec:
  replicas: 1
  strategy:
    type: "Recreate"
  selector:
    matchLabels:
      app: "postgres"
  template:
    metadata:
      labels:
        app: "postgres"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 70
      containers:
        -
          name: "postgres"
          image: "postgres:16-alpine"
          ports:
            -
              name: "service"
              containerPort: 5432
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "1"
              memory: "384Mi"
          readinessProbe:
            timeoutSeconds: 10
            exec:
              command:
                - "sh"
                - "-c"
                - "pg_isready -U \"$POSTGRES_USER\" -d notifyhub"
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            timeoutSeconds: 10
            exec:
              command:
                - "sh"
                - "-c"
                - "pg_isready -U \"$POSTGRES_USER\" -d notifyhub"
            failureThreshold: 60
            periodSeconds: 5
          envFrom:
            -
              secretRef:
                name: "postgres-secrets"
          env:
            -
              name: "POSTGRES_DB"
              value: "notifyhub"
          volumeMounts:
            -
              name: "data"
              mountPath: "/var/lib/postgresql/data"
            -
              name: "init"
              mountPath: "/docker-entrypoint-initdb.d"
              readOnly: true
      volumes:
        -
          name: "data"
          persistentVolumeClaim:
            claimName: "postgres-data"
        -
          name: "init"
          secret:
            secretName: "postgres-init"
            defaultMode: 288
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "postgres"
spec:
  selector:
    app: "postgres"
  ports:
    -
      name: "service"
      port: 5432
      targetPort: 5432
---
apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "redis-data"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "1Gi"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "redis"
spec:
  replicas: 1
  strategy:
    type: "Recreate"
  selector:
    matchLabels:
      app: "redis"
  template:
    metadata:
      labels:
        app: "redis"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        -
          name: "redis"
          image: "redis:7-alpine"
          ports:
            -
              name: "service"
              containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "1"
              memory: "128Mi"
          readinessProbe:
            timeoutSeconds: 10
            exec:
              command:
                - "sh"
                - "-c"
                - "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping"
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            timeoutSeconds: 10
            exec:
              command:
                - "sh"
                - "-c"
                - "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping"
            failureThreshold: 60
            periodSeconds: 5
          envFrom:
            -
              secretRef:
                name: "redis-secrets"
          command:
            - "sh"
            - "-c"
            - "exec redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\""
          volumeMounts:
            -
              name: "data"
              mountPath: "/data"
      volumes:
        -
          name: "data"
          persistentVolumeClaim:
            claimName: "redis-data"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "redis"
spec:
  selector:
    app: "redis"
  ports:
    -
      name: "service"
      port: 6379
      targetPort: 6379
---
