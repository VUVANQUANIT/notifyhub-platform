apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "kafka-data"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "2Gi"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "kafka"
spec:
  replicas: 1
  strategy:
    type: "Recreate"
  selector:
    matchLabels:
      app: "kafka"
  template:
    metadata:
      labels:
        app: "kafka"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        -
          name: "kafka"
          image: "apache/kafka:3.9.0"
          ports:
            -
              name: "service"
              containerPort: 9092
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "1"
              memory: "640Mi"
          readinessProbe:
            timeoutSeconds: 10
            tcpSocket:
              port: 9092
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            timeoutSeconds: 10
            tcpSocket:
              port: 9092
            failureThreshold: 60
            periodSeconds: 5
          env:
            -
              name: "KAFKA_NODE_ID"
              value: "1"
            -
              name: "KAFKA_PROCESS_ROLES"
              value: "broker,controller"
            -
              name: "KAFKA_LISTENERS"
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093"
            -
              name: "KAFKA_ADVERTISED_LISTENERS"
              value: "PLAINTEXT://kafka:9092"
            -
              name: "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP"
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            -
              name: "KAFKA_CONTROLLER_QUORUM_VOTERS"
              value: "1@localhost:9093"
            -
              name: "KAFKA_CONTROLLER_LISTENER_NAMES"
              value: "CONTROLLER"
            -
              name: "KAFKA_INTER_BROKER_LISTENER_NAME"
              value: "PLAINTEXT"
            -
              name: "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR"
              value: "1"
            -
              name: "KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR"
              value: "1"
            -
              name: "KAFKA_TRANSACTION_STATE_LOG_MIN_ISR"
              value: "1"
            -
              name: "KAFKA_LOG_DIRS"
              value: "/var/lib/kafka/data"
            -
              name: "KAFKA_HEAP_OPTS"
              value: "-Xms128m -Xmx256m"
          volumeMounts:
            -
              name: "data"
              mountPath: "/var/lib/kafka/data"
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        -
          name: "data"
          persistentVolumeClaim:
            claimName: "kafka-data"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "kafka"
spec:
  selector:
    app: "kafka"
  ports:
    -
      name: "service"
      port: 9092
      targetPort: 9092
---
