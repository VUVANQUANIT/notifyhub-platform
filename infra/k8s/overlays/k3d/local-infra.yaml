apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "tempo-data"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "1Gi"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "tempo"
spec:
  replicas: 1
  strategy:
    type: "Recreate"
  selector:
    matchLabels:
      app: "tempo"
  template:
    metadata:
      labels:
        app: "tempo"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        -
          name: "tempo"
          image: "grafana/tempo:2.6.1"
          ports:
            -
              name: "service"
              containerPort: 4318
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "1"
              memory: "256Mi"
          readinessProbe:
            timeoutSeconds: 10
            httpGet:
              path: "/ready"
              port: 3200
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            timeoutSeconds: 10
            httpGet:
              path: "/ready"
              port: 3200
            failureThreshold: 60
            periodSeconds: 5
          args:
            - "-config.file=/etc/tempo/tempo.yml"
          volumeMounts:
            -
              name: "data"
              mountPath: "/var/tempo"
            -
              name: "config"
              mountPath: "/etc/tempo"
              readOnly: true
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      volumes:
        -
          name: "data"
          persistentVolumeClaim:
            claimName: "tempo-data"
        -
          name: "config"
          configMap:
            name: "tempo-config"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "tempo"
spec:
  selector:
    app: "tempo"
  ports:
    -
      name: "service"
      port: 4318
      targetPort: 4318
---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "tempo-config"
data:
  tempo.yml: "server:\n  http_listen_port: 3200\ndistributor:\n  receivers:\n    otlp:\n      protocols:\n        http:\n          endpoint: 0.0.0.0:4318\nstorage:\n  trace:\n    backend: local\n    wal:\n      path: /var/tempo/wal\n    local:\n      path: /var/tempo/blocks\ncompactor:\n  compaction:\n    block_retention: 72h\n"
