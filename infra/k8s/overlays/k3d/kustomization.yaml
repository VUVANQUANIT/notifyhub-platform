apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: notifyhub
resources:
  - ../../base
  - local-infra.yaml
patches:
  - target:
      kind: Service
      name: frontend
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30443
