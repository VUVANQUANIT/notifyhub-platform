apiVersion: "networking.k8s.io/v1"
kind: "NetworkPolicy"
metadata:
  name: "default-deny"
spec:
  podSelector: {}
  policyTypes:
    - "Ingress"
---
apiVersion: "networking.k8s.io/v1"
kind: "NetworkPolicy"
metadata:
  name: "local-egress"
spec:
  podSelector: {}
  policyTypes:
    - "Egress"
  egress:
    -
      to:
        -
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "kube-system"
      ports:
        -
          protocol: "UDP"
          port: 53
        -
          protocol: "TCP"
          port: 53
    -
      to:
        -
          podSelector: {}
---
apiVersion: "networking.k8s.io/v1"
kind: "NetworkPolicy"
metadata:
  name: "allow-api-gateway"
spec:
  podSelector:
    matchLabels:
      app: "api-gateway"
  policyTypes:
    - "Ingress"
  ingress:
    -
      from:
        -
          podSelector:
            matchLabels:
              app: "frontend"
      ports:
        -
          protocol: "TCP"
          port: 8080
---
