apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, fsGroup: 101}
      containers:
        - name: nginx
          image: notifyhub/frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: https, containerPort: 8443}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          readinessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
          livenessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
          volumeMounts:
            - {name: temp, mountPath: /tmp}
            - {name: tls, mountPath: /run/tls, readOnly: true}
      volumes:
        - name: temp
          emptyDir: {}
        - name: tls
          secret:
            secretName: notifyhub-tls
            defaultMode: 288
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: ClusterIP
  selector: {app: frontend}
  ports:
    - {name: https, port: 443, targetPort: https}
