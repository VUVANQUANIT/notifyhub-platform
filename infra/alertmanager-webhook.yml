# Opt-in external receiver. Mount the URL/authorization as files; never commit credentials here.
global:
  resolve_timeout: 5m
route:
  receiver: operations-webhook
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: operations-webhook
    webhook_configs:
      - url_file: /run/secrets/alert_webhook_url
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/alert_webhook_token
