# Apply only when enabling real providers; local overlay needs no public egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: real-provider-egress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [auth-service, notification-service]
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 587}
        - {protocol: TCP, port: 443}
