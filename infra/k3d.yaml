apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: notifyhub
servers: 1
agents: 0
image: rancher/k3s:v1.35.5-k3s1
kubeAPI:
  hostIP: 127.0.0.1
  hostPort: "36443"
ports:
  - port: 127.0.0.1:8443:30443
    nodeFilters: [server:0]
options:
  k3d:
    wait: true
    timeout: 120s
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters: [server:*]
      - arg: --disable=servicelb
        nodeFilters: [server:*]
      - arg: --secrets-encryption
        nodeFilters: [server:*]
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
