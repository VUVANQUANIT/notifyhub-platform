# Explicit opt-in for a real SMTP service. STARTTLS and hostname verification are mandatory.
spring:
  mail:
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.checkserveridentity: true
notification:
  worker:
    mail-from: ${MAIL_FROM}
