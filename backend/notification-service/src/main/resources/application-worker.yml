spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:notifyhub}
    password: ${RABBITMQ_PASSWORD:notifyhub_local_password}
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 5s
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 16
        concurrency: 2
        max-concurrency: 2
        default-requeue-rejected: true
notification:
  sms:
    provider: ${SMS_PROVIDER:simulated}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      api-key-sid: ${TWILIO_API_KEY_SID:}
      api-key-secret: ${TWILIO_API_KEY_SECRET:}
      from: ${TWILIO_FROM:}
      messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}
  worker:
    enabled: true
    polling-enabled: true
    poll-delay-ms: 1000
    max-attempts: 4
    initial-retry-delay: 1s
    max-retry-delay: 60s
    mail-from: ${MAIL_FROM:notifyhub@localhost}
