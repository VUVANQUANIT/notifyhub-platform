server:
  address: 127.0.0.1
spring:
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/notifyhub}
    username: ${AUTH_DB_USERNAME:notifyhub}
    password: ${AUTH_DB_PASSWORD:notifyhub_local_password}
auth:
  issuer: ${JWT_ISSUER_URI:http://127.0.0.1:8081}
  signing-key-path: ${AUTH_SIGNING_KEY_PATH:.env.auth-local-private.pem}
  registration-enabled: ${AUTH_REGISTRATION_ENABLED:true}
