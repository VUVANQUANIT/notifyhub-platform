server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
            - id: campaign-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/campaigns/**
            - id: reporting-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/reports/**
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
