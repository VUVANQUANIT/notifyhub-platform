management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false
spring:
  kafka:
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  rabbitmq:
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
