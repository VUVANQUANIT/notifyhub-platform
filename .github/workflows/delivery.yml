name: Delivery

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Image version, for example v0.1.0-rc.1
        required: true
        type: string

permissions: {}

concurrency:
  group: delivery-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish / ${{ matrix.service }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - campaign-service
          - notification-service
          - reporting-service
    steps:
      - name: Validate release version
        shell: bash
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be SemVer-like, for example v0.1.0 or v0.1.0-rc.1" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a release commit from main
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit must be reachable from origin/main" >&2
            exit 1
          fi

      - name: Resolve image name
        id: image
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository="${GITHUB_REPOSITORY#*/}"
          repository="${repository,,}"
          echo "name=ghcr.io/${owner}/${repository}-${SERVICE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=NotifyHub ${{ matrix.service }}
            org.opencontainers.image.description=NotifyHub microservice image

      - name: Build and publish image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          build-args: MODULE=${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Record immutable image digest
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SERVICE: ${{ matrix.service }}
        run: |
          mkdir -p image-digest
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > "image-digest/${SERVICE}.txt"

      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.service }}
          path: image-digest/${{ matrix.service }}.txt
          retention-days: 90
